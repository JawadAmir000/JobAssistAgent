[project]
name = "jobbot"
version = "0.1.0"
description = "Manual-first, low-token job application assistant for FDE roles"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "playwright>=1.47",
    "python-jobspy>=1.1.80",
    "anthropic>=0.40",
    "keyring>=25.0",
    "rapidfuzz>=3.9",
    # CV text extraction (config.load_cv_text). It was only ever present as a transitive dependency, and
    # the import sits inside a bare except, so on a clean install every screening answer quietly lost its
    # CV grounding instead of failing.
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jobbot = "jobbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
